<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620">
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill:#e2e8f0; }
    .hdr { font-weight:700; letter-spacing:0.03em; }
    .lbl { font-size:13px; }
    .sub { font-size:11px; fill:#94a3b8; }
    .arr { font-size:10px; fill:#cbd5e1; letter-spacing:0.02em; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="9" markerHeight="7" refX="7" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="7" refX="7" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#a855f7"/></marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="7" refX="7" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#f97316"/></marker>
    <filter id="glow-purple"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1040" height="620" fill="url(#bg-grad)"/>
  <text x="520" y="44" text-anchor="middle" class="hdr" font-size="17">kiro-acp-plugin &#8212; MCP &#8596; ACP bridge</text>
  <text x="520" y="66" text-anchor="middle" class="sub">delegate a task to the local kiro-cli agent, get a verified result back</text>
  <rect x="40" y="95" width="215" height="470" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="147" y="122" text-anchor="middle" class="hdr lbl" fill="#3b82f6">CLAUDE CODE (host)</text>
  <rect x="58" y="140" width="179" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="147" y="166" text-anchor="middle" class="lbl">Claude (LLM)</text>
  <text x="147" y="185" text-anchor="middle" class="sub">decides what to delegate</text>
  <rect x="58" y="218" width="179" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="147" y="240" text-anchor="middle" class="lbl">/kiro &lt;task&gt;</text>
  <text x="147" y="257" text-anchor="middle" class="sub">slash command</text>
  <rect x="58" y="286" width="179" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="147" y="308" text-anchor="middle" class="lbl">delegating-to-kiro</text>
  <text x="147" y="325" text-anchor="middle" class="sub">skill: when &amp; verify</text>
  <rect x="58" y="430" width="179" height="115" rx="6" fill="#0d1220" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="147" y="452" text-anchor="middle" class="sub">verifies result:</text>
  <text x="147" y="472" text-anchor="middle" class="sub">git diff &#183; run tests</text>
  <text x="147" y="500" text-anchor="middle" class="sub" fill="#64748b">(never trusts</text>
  <text x="147" y="517" text-anchor="middle" class="sub" fill="#64748b">self-report)</text>
  <rect x="360" y="95" width="300" height="470" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple)"/>
  <text x="510" y="122" text-anchor="middle" class="hdr lbl" fill="#a855f7">PLUGIN MCP SERVER</text>
  <text x="510" y="139" text-anchor="middle" class="sub">Node, single bundled dist/index.js</text>
  <rect x="378" y="152" width="264" height="150" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="392" y="172" class="sub" fill="#c4b5fd">MCP tools</text>
  <rect x="392" y="182" width="236" height="32" rx="5" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
  <text x="510" y="203" text-anchor="middle" class="lbl">kiro_prompt(task, session?)</text>
  <rect x="392" y="220" width="236" height="32" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="241" text-anchor="middle" class="lbl">kiro_cancel(session)</text>
  <rect x="392" y="258" width="236" height="32" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="279" text-anchor="middle" class="lbl">kiro_list_sessions()</text>
  <rect x="378" y="320" width="264" height="58" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="510" y="344" text-anchor="middle" class="lbl">KiroConnection</text>
  <text x="510" y="363" text-anchor="middle" class="sub">lazy spawn &#183; ACP client &#183; restart</text>
  <rect x="378" y="392" width="264" height="58" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="510" y="416" text-anchor="middle" class="lbl">SessionRegistry</text>
  <text x="510" y="435" text-anchor="middle" class="sub">idle &#183; running &#183; dead</text>
  <text x="510" y="478" text-anchor="middle" class="sub" fill="#64748b">one kiro child, multiplexed</text>
  <text x="510" y="496" text-anchor="middle" class="sub" fill="#64748b">across N sessions</text>
  <text x="510" y="525" text-anchor="middle" class="sub" fill="#64748b">timeout / crash &#8594; partial output</text>
  <rect x="770" y="95" width="230" height="470" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="885" y="122" text-anchor="middle" class="hdr lbl" fill="#f97316">kiro-cli acp</text>
  <text x="885" y="139" text-anchor="middle" class="sub">child process (v2.6)</text>
  <rect x="788" y="156" width="194" height="58" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1"/>
  <text x="885" y="180" text-anchor="middle" class="lbl">ACP agent</text>
  <text x="885" y="199" text-anchor="middle" class="sub">autonomous coding</text>
  <rect x="788" y="232" width="194" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="885" y="254" text-anchor="middle" class="lbl">sessions 1..N</text>
  <text x="885" y="272" text-anchor="middle" class="sub">own conversation each</text>
  <rect x="788" y="302" width="194" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="885" y="324" text-anchor="middle" class="lbl">fs &#183; bash tools</text>
  <text x="885" y="342" text-anchor="middle" class="sub">--trust-all-tools</text>
  <rect x="788" y="430" width="194" height="115" rx="6" fill="#0d1220" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="885" y="455" text-anchor="middle" class="sub">edits files &amp;</text>
  <text x="885" y="474" text-anchor="middle" class="sub">runs commands</text>
  <text x="885" y="502" text-anchor="middle" class="sub" fill="#64748b">on the shared</text>
  <text x="885" y="519" text-anchor="middle" class="sub" fill="#64748b">filesystem</text>
  <path d="M255,245 H355" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="266" y="226" width="80" height="16" rx="3" fill="#0f0f1a" opacity="0.95"/>
  <text x="306" y="238" text-anchor="middle" class="arr">MCP call</text>
  <path d="M355,400 H260" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <rect x="258" y="381" width="98" height="16" rx="3" fill="#0f0f1a" opacity="0.95"/>
  <text x="307" y="393" text-anchor="middle" class="arr">progress+result</text>
  <path d="M660,245 H765" stroke="#a855f7" stroke-width="1.8" fill="none" marker-end="url(#arr-purple)"/>
  <rect x="668" y="226" width="92" height="16" rx="3" fill="#0f0f1a" opacity="0.95"/>
  <text x="714" y="238" text-anchor="middle" class="arr">session/prompt</text>
  <path d="M765,400 H665" stroke="#f97316" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <rect x="666" y="381" width="94" height="16" rx="3" fill="#0f0f1a" opacity="0.95"/>
  <text x="713" y="393" text-anchor="middle" class="arr">session/update</text>
  <text x="306" y="540" text-anchor="middle" class="sub" fill="#475569">stdio JSON-RPC</text>
  <text x="306" y="556" text-anchor="middle" class="sub" fill="#475569">(MCP)</text>
  <text x="713" y="540" text-anchor="middle" class="sub" fill="#475569">stdio JSON-RPC</text>
  <text x="713" y="556" text-anchor="middle" class="sub" fill="#475569">(ACP)</text>
  <rect x="40" y="582" width="960" height="26" rx="5" fill="#0d1220" stroke="#1e293b" stroke-width="1"/>
  <line x1="58" y1="595" x2="92" y2="595" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="100" y="599" class="arr">request (solid)</text>
  <line x1="230" y1="595" x2="264" y2="595" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="272" y="599" class="arr">streamed notifications / result (dashed)</text>
  <text x="620" y="599" class="arr" fill="#94a3b8">blue = Claude&#8594;server &#183; purple = server &#8596; Claude/kiro &#183; orange = kiro&#8594;server</text>
</svg>